name: Update Profile Telemetry

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch live contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Render adaptive editorial headers
        run: python scripts/render_editorial_header.py

      - name: Commit updated telemetry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution telemetry [skip ci]"
          file_pattern: "data/contributions.json header-dark.svg header-light.svg"
