<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .fade { opacity: 0; animation: fadeIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.42; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { opacity: 1; animation: none; }
      .pulse { animation: none; }
    }
  </style>

  <rect width="880" height="184" fill="#ffffff"/>
  <line x1="0" y1="1" x2="880" y2="1" stroke="#d0d7de" stroke-width="1"/>

  <text x="0" y="28" class="mono fade" font-size="11" letter-spacing="0.9" fill="#656d76">01 // INDEX — ARYAMEHR NAMDARY</text>
  <text x="880" y="28" text-anchor="end" class="mono fade" font-size="11" letter-spacing="0.4" fill="#0969da">SUT · COMPUTER &amp; AEROSPACE ENGINEERING</text>

  <!-- Minimal aerospace delta monogram -->
  <g transform="translate(838, 52)" class="fade" style="animation-delay:0.08s">
    <rect width="42" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <path d="M21 9 L32 31 L21 25.5 L10 31 Z" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="21" y1="9" x2="21" y2="33" stroke="#0969da" stroke-width="1" opacity="0.55"/>
  </g>

  <text x="0" y="82" class="sans fade" font-size="36" font-weight="700" fill="#1f2328" style="animation-delay:0.05s">AryaMehr Namdary</text>
  <text x="0" y="114" class="sans fade" font-size="15" fill="#59636e" style="animation-delay:0.10s">Designing safety-critical AI agent tooling, async web security platforms &amp; autonomous quant systems.</text>

  <line x1="0" y1="140" x2="880" y2="140" stroke="#e5e9ee" stroke-width="1"/>

  <text x="0" y="164" class="mono fade" font-size="11.5" style="animation-delay:0.15s">
    <tspan fill="#656d76" font-weight="600">STACK</tspan><tspan dx="12" fill="#24292f">Python · TypeScript · React 19 · Rust · Laravel · PyTorch</tspan>
  </text>

  <text x="862" y="164" text-anchor="end" class="mono fade" font-size="11.5" fill="#1a7f37" style="animation-delay:0.15s">9 REPOS · 25D STREAK · 39 COMMITS</text>
  <circle cx="874" cy="160" r="3.6" fill="#1a7f37" class="pulse"/>

  <line x1="0" y1="183" x2="880" y2="183" stroke="#e5e9ee" stroke-width="1"/>
</svg>
